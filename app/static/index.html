<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wörterbuch</title>
<style>
  :root {
    --bg: #faf7f2;
    --ink: #2b2620;
    --muted: #8a7f6f;
    --accent: #a05c2c;
    --card: #ffffff;
    --line: #e8e0d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 1rem 3rem;
  }
  header { text-align: center; margin-bottom: 2.5rem; }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: normal;
    letter-spacing: .02em;
    margin: 0 0 .4rem;
  }
  .stats { color: var(--muted); font-size: .95rem; font-style: italic; }
  .search {
    width: min(620px, 100%);
    display: flex;
    gap: .5rem;
  }
  #q {
    flex: 1;
    font: inherit;
    font-size: 1.2rem;
    padding: .7rem 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #lang {
    font: inherit;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }
  #results {
    width: min(620px, 100%);
    margin-top: 1.8rem;
    list-style: none;
    padding: 0;
  }
  #results li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .8rem 1.1rem;
    margin-bottom: .6rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  #results .word { font-size: 1.15rem; }
  #results .left { display: flex; align-items: center; gap: .7rem; }
  #results .thumb { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
  #results .def { color: var(--muted); font-size: .9rem; text-align: right; }
  .wref { cursor: pointer; border-bottom: 1px dotted var(--accent); }
  .wref:hover { color: var(--accent); }
  #tip {
    display: none; position: absolute; z-index: 10; max-width: 320px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: .5rem .7rem;
    font-size: .85rem; color: var(--ink);
  }
  .hint { color: var(--muted); margin-top: 1.5rem; font-size: .9rem; }
  footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Wörterbuch</h1>
  <div class="stats" id="stats">…</div>
</header>

<div class="search">
  <input id="q" type="search" placeholder="Wort suchen …" autofocus autocomplete="off">
  <select id="lang"></select>
</div>

<ul id="results"></ul>
<div class="hint" id="hint"></div>

<footer>
  Maschinell geerntet · <a href="/verzeichnis">Stichwortverzeichnis</a> · <a href="/bewerten">Bilder bewerten</a> · <a href="/docs">API-Doku</a> · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a>
</footer>

<script>
const q = document.getElementById('q');
const lang = document.getElementById('lang');
const results = document.getElementById('results');
const hint = document.getElementById('hint');
let timer = null;

async function loadMeta() {
  const [stats, langs] = await Promise.all([
    fetch('/stats').then(r => r.json()),
    fetch('/languages').then(r => r.json()),
  ]);
  document.getElementById('stats').textContent =
    stats.total_entries.toLocaleString('de-DE') + ' Einträge';
  for (const l of langs) {
    const o = document.createElement('option');
    o.value = l.language;
    o.textContent = l.language.toUpperCase() + ' (' + l.count.toLocaleString('de-DE') + ')';
    lang.appendChild(o);
  }
}

// --- Querverweise: Wörter in Definitionen werden hover- & klickbar ---
const STOPWORDS = Object.fromEntries(Object.entries({
  de: 'der die das den dem des ein eine einer einem einen eines und oder aber mit für von zu in im am an auf aus bei nach über unter vor zwischen durch um als auch nicht nur sehr mehr wenig ist sind war waren wird werden hat haben hatte ich du er sie es wir ihr man sich so wie wenn dann denn noch schon zum zur vom beim ins ans',
  en: 'the a an and or but with for from to in on at of by as is are was were be been has have had not no so if then than this that these those it its he she they we you i his her their our your my',
  fr: 'le la les un une des de du au aux et ou mais avec pour dans sur par est sont était être a ont ce cette ces il elle ils elles on ne pas plus très son sa ses mon ma mes ton ta tes',
  es: 'el la los las un una unos unas de del al y o pero con para por en es son era ser ha han este esta estos estas su sus mi mis tu tus no más muy se lo le les',
  it: 'il lo la i gli le un una uno dei delle di del della al alla e o ma con per in su è sono era essere ha hanno questo questa questi queste suo sua suoi non più molto si ne ci',
}).map(([k, v]) => [k, new Set(v.split(' '))]));
const xrefCache = new Map();
const tip = document.createElement('div');
tip.id = 'tip';
document.body.appendChild(tip);
let tipTimer = null;

function xrefCandidates(tok) {
  const t = tok.replace(/^['’\-]+|['’\-]+$/g, '');
  const low = t.toLowerCase();
  const cap = low.charAt(0).toUpperCase() + low.slice(1);
  return [...new Set([t, low, cap])];
}

async function xrefLookup(word, langCode) {
  for (const cand of xrefCandidates(word)) {
    const key = langCode + '|' + cand.toLowerCase();
    if (!xrefCache.has(key)) {
      try {
        const r = await fetch('/lookup?' + new URLSearchParams({ word: cand, language: langCode }));
        xrefCache.set(key, r.ok ? await r.json() : null);
      } catch { xrefCache.set(key, null); }
    }
    const hit = xrefCache.get(key);
    if (hit) return hit;
  }
  return null;
}

function showTip(anchor, entry) {
  tip.innerHTML = '';
  const w = document.createElement('b');
  w.textContent = entry.word;
  tip.appendChild(w);
  tip.appendChild(document.createTextNode(' — ' + (entry.definition || '')));
  tip.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const maxX = window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8;
  tip.style.left = Math.max(8, Math.min(r.left + window.scrollX, maxX)) + 'px';
  tip.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function linkify(defEl, text, langCode) {
  const stops = STOPWORDS[langCode] || new Set();
  const re = /\p{L}[\p{L}\-'’]*/gu;
  let last = 0;
  for (const m of text.matchAll(re)) {
    defEl.appendChild(document.createTextNode(text.slice(last, m.index)));
    last = m.index + m[0].length;
    const raw = m[0];
    if (raw.length < 3 || stops.has(raw.toLowerCase())) {
      defEl.appendChild(document.createTextNode(raw));
      continue;
    }
    const s = document.createElement('span');
    s.className = 'wref';
    s.textContent = raw;
    s.addEventListener('mouseenter', () => {
      tipTimer = setTimeout(async () => {
        const hit = await xrefLookup(raw, langCode);
        if (!hit) { s.classList.remove('wref'); return; }
        showTip(s, hit);
      }, 200);
    });
    s.addEventListener('mouseleave', () => { clearTimeout(tipTimer); tip.style.display = 'none'; });
    s.addEventListener('click', () => {
      location.href = '/?' + new URLSearchParams({ q: raw, lang: langCode });
    });
    defEl.appendChild(s);
  }
  defEl.appendChild(document.createTextNode(text.slice(last)));
}

async function search() {
  const term = q.value.trim();
  if (term.length < 2) { results.innerHTML = ''; hint.textContent = ''; return; }
  const params = new URLSearchParams({ language: lang.value, q: term, limit: 50 });
  const rows = await fetch('/entries?' + params).then(r => r.json());
  results.innerHTML = '';
  hint.textContent = rows.length === 50 ? 'Erste 50 Treffer — Suche verfeinern für mehr.' :
                     rows.length === 0 ? 'Nichts gefunden.' : '';
  for (const e of rows) {
    const li = document.createElement('li');
    const left = document.createElement('span');
    left.className = 'left';
    if (e.image) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = '/bilder/' + e.image;
      img.alt = '';
      img.loading = 'lazy';
      left.appendChild(img);
    }
    const w = document.createElement('span');
    w.className = 'word';
    w.textContent = e.word;
    left.appendChild(w);
    const d = document.createElement('span');
    d.className = 'def';
    linkify(d, e.definition || '', lang.value);
    li.append(left, d);
    results.appendChild(li);
  }
}

q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(search, 200);
});
lang.addEventListener('change', search);

loadMeta().then(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('lang') && [...lang.options].some(o => o.value === p.get('lang'))) lang.value = p.get('lang');
  if (p.get('q')) q.value = p.get('q');
  search();
});
</script>
</body>
</html>
