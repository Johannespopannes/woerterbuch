<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wörterbuch</title>
<style>
  :root {
    --bg: #faf7f2;
    --ink: #292521;
    --muted: #8a7f6f;
    --accent: #a75a31;
    --card: #ffffff;
    --line: #e6ded2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 1rem 3rem;
  }
  /* kleiner fester Markenbereich statt riesiger Ueberschrift */
  .brandrow { width: min(620px, 100%); display: flex;
              justify-content: space-between; align-items: baseline;
              margin-bottom: 1.4rem; }
  .brandname { color: var(--accent); font-size: .95rem; cursor: pointer; }
  .brandrow nav a { color: var(--accent); text-decoration: none;
                    font-size: .9rem; }
  .brandrow nav a:hover { text-decoration: underline; }
  h1.seitentitel {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: normal;
    letter-spacing: .02em;
    margin: 0 0 .8rem;
  }
  /* Mitmachen-Karten */
  .mitmachen { width: min(620px, 100%); display: grid;
               grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: 1.2rem; }
  @media (max-width: 520px) { .mitmachen { grid-template-columns: 1fr; } }
  .mcard { display: block; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: .85rem 1.1rem;
           text-decoration: none; color: inherit; }
  .mcard:hover { border-color: var(--accent); }
  .mcard b { display: block; font-size: 1.02rem; margin-bottom: .2rem; }
  .mcard span.d { color: var(--muted); font-size: .87rem; }
  .mcard .go { color: var(--accent); font-size: .85rem; margin-top: .45rem;
               display: inline-block; }
  .fstats { width: min(620px, 100%); margin-top: 1.6rem; color: var(--muted);
            font-size: .85rem; }
  .fstats a { color: var(--accent); text-decoration: none; }
  .search {
    width: min(620px, 100%);
    display: flex;
    gap: .5rem;
  }
  .qwrap { position: relative; flex: 1; display: flex; }
  #clear {
    position: absolute; right: .55rem; top: 50%;
    transform: translateY(-50%);
    width: 1.7rem; height: 1.7rem; border-radius: 50%;
    border: none; background: var(--line); color: var(--ink);
    font-size: 1rem; line-height: 1; cursor: pointer; display: none;
  }
  #clear:hover { background: var(--accent); color: #fff; }
  #q {
    flex: 1;
    font: inherit;
    font-size: 1.2rem;
    padding: .7rem 2.5rem .7rem 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #lang {
    font: inherit;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }
  .topsearches {
    width: min(620px, 100%);
    margin-top: .9rem;
    display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
  }
  .topsearches .lbl { color: var(--muted); font-size: .85rem; font-style: italic; }
  .topsearches button {
    font: inherit; font-size: .85rem;
    padding: .25rem .7rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  .topsearches button:hover { border-color: var(--accent); color: var(--accent); }
  #results {
    width: min(620px, 100%);
    margin-top: 1.8rem;
    list-style: none;
    padding: 0;
  }
  #results li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .8rem 1.1rem;
    margin-bottom: .6rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
  }
  #results .comp {
    flex-basis: 100%;
    font-size: .8rem;
    color: var(--muted);
  }
  #results .comp a { color: var(--accent); text-decoration: none; }
  #results .comp a:hover { text-decoration: underline; }
  #results .word { font-size: 1.15rem; }
  /* Mini-Konfidenz rot->gruen; grau = noch ungeprueft */
  .confmini { display: inline-block; width: 34px; height: 5px;
              border-radius: 999px; background: var(--line);
              margin-left: .5rem; vertical-align: middle; overflow: hidden; }
  .confmini i { display: block; height: 100%; border-radius: 999px;
                background: linear-gradient(90deg, #c0392b, #e67e22, #27ae60); }
  a.wordlink { color: inherit; text-decoration: none; }
  a.wordlink:hover { color: var(--accent); }
  #results .left { display: flex; align-items: center; gap: .7rem; }
  #results .thumb { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
  #results .def { color: var(--muted); font-size: .9rem; text-align: right; }
  .wref { cursor: pointer; border-bottom: 1px dotted var(--accent); }
  .wref:hover { color: var(--accent); }
  #tip {
    display: none; position: absolute; z-index: 10; max-width: 320px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: .5rem .7rem;
    font-size: .85rem; color: var(--ink);
  }
  .hint { color: var(--muted); margin-top: 1.5rem; font-size: .9rem; }
  /* Entdecken-Karte: ein Wort zum Stöbern, direkt auf seiner Seite landen */
  .discover { width: min(680px, 100%); margin-top: 1.6rem; }
  .dcard { display: flex; gap: 1rem; align-items: center;
           background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: .9rem 1.1rem;
           text-decoration: none; color: inherit; }
  .dcard:hover { border-color: var(--accent); }
  .dcard img { width: 72px; height: 72px; border-radius: 10px;
               object-fit: cover; border: 1px solid var(--line);
               background: var(--bg); flex-shrink: 0; }
  .dmain { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
  .dlabel { color: var(--muted); font-size: .78rem;
            text-transform: uppercase; letter-spacing: .08em; }
  .dword { font-size: 1.3rem; }
  .ddef { color: var(--muted); font-size: .9rem; }
  .dactions { display: flex; gap: .8rem; align-items: center;
              margin-top: .6rem; flex-wrap: wrap; }
  .dactions button, .dcta {
    font: inherit; font-size: .9rem; padding: .4rem .9rem;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    cursor: pointer; text-decoration: none;
  }
  .dactions button:hover, .dcta:hover {
    border-color: var(--accent); color: var(--accent);
  }
  footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="brandrow">
  <span class="brandname" id="home" title="Zurück zur Startseite">Wörterbuch</span>
  <nav><a href="/verzeichnis">A–Z</a></nav>
</div>
<h1 class="seitentitel">Ein Wort suchen</h1>

<div class="search">
  <div class="qwrap">
    <input id="q" type="search" placeholder="Wort suchen …" autofocus autocomplete="off">
    <button id="clear" title="Suche leeren" aria-label="Suche leeren">✕</button>
  </div>
  <select id="lang"></select>
</div>
<div class="topsearches" id="top"></div>

<div id="discover" class="discover">
  <a id="dlink" class="dcard">
    <img id="dimg" alt="">
    <span class="dmain">
      <span class="dlabel">Zufällig entdecken</span>
      <span class="dword" id="dword"></span>
      <span class="ddef" id="ddef"></span>
    </span>
  </a>
  <div class="dactions">
    <button id="dnext" type="button">↻ Nächstes Wort</button>
    <a class="dcta" href="/bewerten">Mitmachen: Bilder bewerten</a>
  </div>
</div>

<div class="mitmachen">
  <a class="mcard" href="/bewerten">
    <b>Bilder bewerten</b>
    <span class="d">Passt das Bild zum Wort?</span>
    <span class="go">Mitmachen →</span>
  </a>
  <a class="mcard" href="/verzeichnis">
    <b>Wörter prüfen</b>
    <span class="d">Gehört das Wort zur Sprache?</span>
    <span class="go">Mitmachen →</span>
  </a>
</div>

<ul id="results"></ul>
<div class="hint" id="hint"></div>

<div class="fstats" id="fstats"></div>

<footer>
  <a href="/">Zur Suche</a> · <a href="/verzeichnis">Stichwortverzeichnis</a> · <a href="/bewerten">Bilder bewerten</a> · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a>
</footer>

<script>
const q = document.getElementById('q');
const lang = document.getElementById('lang');
const results = document.getElementById('results');
const hint = document.getElementById('hint');
const clearBtn = document.getElementById('clear');
let timer = null;

function resetSearch() {
  q.value = '';
  results.innerHTML = '';
  hint.textContent = '';
  clearBtn.style.display = 'none';
  history.replaceState(null, '', '/');
  discover.style.display = '';
  loadDiscover();
  q.focus();
}
clearBtn.addEventListener('click', resetSearch);
document.getElementById('home').addEventListener('click', resetSearch);

async function loadMeta() {
  const [stats, langs] = await Promise.all([
    fetch('/stats').then(r => r.json()),
    fetch('/languages').then(r => r.json()),
  ]);
  document.getElementById('fstats').innerHTML =
    stats.total_entries.toLocaleString('de-DE') + ' Einträge · ' +
    langs.length + ' Sprachen · <a href="/docs">API-Dokumentation →</a>';
  for (const l of langs) {
    const o = document.createElement('option');
    o.value = l.language;
    o.textContent = l.language.toUpperCase() + ' (' + l.count.toLocaleString('de-DE') + ')';
    lang.appendChild(o);
  }
}

// --- Querverweise: Wörter in Definitionen werden hover- & klickbar ---
const STOPWORDS = Object.fromEntries(Object.entries({
  de: 'der die das den dem des ein eine einer einem einen eines und oder aber mit für von zu in im am an auf aus bei nach über unter vor zwischen durch um als auch nicht nur sehr mehr wenig ist sind war waren wird werden hat haben hatte ich du er sie es wir ihr man sich so wie wenn dann denn noch schon zum zur vom beim ins ans',
  en: 'the a an and or but with for from to in on at of by as is are was were be been has have had not no so if then than this that these those it its he she they we you i his her their our your my',
  fr: 'le la les un une des de du au aux et ou mais avec pour dans sur par est sont était être a ont ce cette ces il elle ils elles on ne pas plus très son sa ses mon ma mes ton ta tes',
  es: 'el la los las un una unos unas de del al y o pero con para por en es son era ser ha han este esta estos estas su sus mi mis tu tus no más muy se lo le les',
  it: 'il lo la i gli le un una uno dei delle di del della al alla e o ma con per in su è sono era essere ha hanno questo questa questi queste suo sua suoi non più molto si ne ci',
}).map(([k, v]) => [k, new Set(v.split(' '))]));
const xrefCache = new Map();
const tip = document.createElement('div');
tip.id = 'tip';
document.body.appendChild(tip);
let tipTimer = null;

function xrefCandidates(tok) {
  const t = tok.replace(/^['’\-]+|['’\-]+$/g, '');
  const low = t.toLowerCase();
  const cap = low.charAt(0).toUpperCase() + low.slice(1);
  return [...new Set([t, low, cap])];
}

async function xrefLookup(word, langCode) {
  for (const cand of xrefCandidates(word)) {
    const key = langCode + '|' + cand.toLowerCase();
    if (!xrefCache.has(key)) {
      try {
        const r = await fetch('/lookup?' + new URLSearchParams({ word: cand, language: langCode }));
        xrefCache.set(key, r.ok ? await r.json() : null);
      } catch { xrefCache.set(key, null); }
    }
    const hit = xrefCache.get(key);
    if (hit) return hit;
  }
  return null;
}

function showTip(anchor, entry) {
  tip.innerHTML = '';
  const w = document.createElement('b');
  w.textContent = entry.word;
  tip.appendChild(w);
  tip.appendChild(document.createTextNode(' — ' + (entry.definition || '')));
  tip.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const maxX = window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8;
  tip.style.left = Math.max(8, Math.min(r.left + window.scrollX, maxX)) + 'px';
  tip.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function linkify(defEl, text, langCode) {
  const stops = STOPWORDS[langCode] || new Set();
  const re = /\p{L}[\p{L}\-'’]*/gu;
  let last = 0;
  for (const m of text.matchAll(re)) {
    defEl.appendChild(document.createTextNode(text.slice(last, m.index)));
    last = m.index + m[0].length;
    const raw = m[0];
    if (raw.length < 3 || stops.has(raw.toLowerCase())) {
      defEl.appendChild(document.createTextNode(raw));
      continue;
    }
    const s = document.createElement('span');
    s.className = 'wref';
    s.textContent = raw;
    s.addEventListener('mouseenter', () => {
      tipTimer = setTimeout(async () => {
        const hit = await xrefLookup(raw, langCode);
        if (!hit) { s.classList.remove('wref'); return; }
        showTip(s, hit);
      }, 200);
    });
    s.addEventListener('mouseleave', () => { clearTimeout(tipTimer); tip.style.display = 'none'; });
    s.addEventListener('click', () => {
      location.href = '/?' + new URLSearchParams({ q: raw, lang: langCode });
    });
    defEl.appendChild(s);
  }
  defEl.appendChild(document.createTextNode(text.slice(last)));
}

const discover = document.getElementById('discover');

async function loadDiscover() {
  try {
    const d = await fetch('/zufall?' + new URLSearchParams({ language: lang.value }))
      .then(r => r.ok ? r.json() : null);
    if (!d) { discover.style.display = 'none'; return; }
    document.getElementById('dimg').src = '/bilder/' + d.image;
    document.getElementById('dword').textContent = d.word;
    document.getElementById('ddef').textContent = d.definition || '';
    document.getElementById('dlink').href =
      '/worteintrag?' + new URLSearchParams({ word: d.word, lang: d.language });
    // nicht mitten in einer Suche wieder einblenden
    if (q.value.trim().length < 2) discover.style.display = '';
  } catch { discover.style.display = 'none'; }
}

document.getElementById('dnext').addEventListener('click', (e) => {
  e.preventDefault();
  loadDiscover();
});

async function search() {
  const term = q.value.trim();
  discover.style.display = term.length < 2 ? '' : 'none';
  if (term.length < 2) { results.innerHTML = ''; hint.textContent = ''; return; }
  const params = new URLSearchParams({ language: lang.value, q: term, limit: 50 });
  const rows = await fetch('/entries?' + params).then(r => r.json());
  results.innerHTML = '';
  hint.textContent = rows.length === 50 ? 'Erste 50 Treffer — Suche verfeinern für mehr.' :
                     rows.length === 0 ? 'Nichts gefunden.' : '';
  for (const e of rows) {
    const li = document.createElement('li');
    const left = document.createElement('span');
    left.className = 'left';
    if (e.image) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = '/bilder/' + e.image;
      img.alt = '';
      img.loading = 'lazy';
      left.appendChild(img);
    }
    const w = document.createElement('a');
    w.className = 'word wordlink';
    w.textContent = e.word;
    w.href = '/worteintrag?' + new URLSearchParams({ word: e.word, lang: lang.value });
    left.appendChild(w);
    if (e.confidence != null) {
      const mini = document.createElement('span');
      mini.className = 'confmini';
      mini.title = 'Sprach-Konfidenz ' +
        (Math.round(e.confidence * 1000) / 10).toLocaleString('de-DE') + ' %';
      const fill = document.createElement('i');
      fill.style.width = Math.round(e.confidence * 100) + '%';
      mini.appendChild(fill);
      left.appendChild(mini);
    } else if (e.sprache_unsicher) {
      const mini = document.createElement('span');
      mini.className = 'confmini';
      mini.title = 'Sprachzugehörigkeit beanstandet';
      left.appendChild(mini);
    }
    const d = document.createElement('span');
    d.className = 'def';
    linkify(d, e.definition || '', lang.value);
    li.append(left, d);
    // Kompositum? -> Bestandteile als Links unter dem Wort anzeigen
    if (e.word.length >= 8) {
      fetch('/zerlegen?' + new URLSearchParams({ word: e.word, language: lang.value }))
        .then(r => r.ok ? r.json() : null)
        .then(z => {
          if (!z || !z.parts || z.parts.length < 2) return;
          const comp = document.createElement('span');
          comp.className = 'comp';
          comp.appendChild(document.createTextNode('= '));
          z.parts.forEach((p, idx) => {
            if (idx) comp.appendChild(document.createTextNode(' + '));
            const a = document.createElement('a');
            a.textContent = p.entry;
            a.href = '/?' + new URLSearchParams({ q: p.entry, lang: lang.value });
            comp.appendChild(a);
          });
          li.appendChild(comp);
        })
        .catch(() => {});
    }
    // Wortfamilie? -> bekannte Formen derselben Grundform verlinken
    fetch('/formen?' + new URLSearchParams({ word: e.word, language: lang.value }))
      .then(r => r.ok ? r.json() : null)
      .then(f => {
        if (!f || !f.forms || f.forms.length < 2) return;
        const fam = document.createElement('span');
        fam.className = 'comp';
        fam.appendChild(document.createTextNode('Formen von '));
        const lm = document.createElement('a');
        lm.textContent = f.lemma;
        lm.href = '/?' + new URLSearchParams({ q: f.lemma, lang: lang.value });
        fam.appendChild(lm);
        fam.appendChild(document.createTextNode(': '));
        f.forms.forEach((fo, idx) => {
          if (idx) fam.appendChild(document.createTextNode(' · '));
          const a = document.createElement('a');
          a.textContent = fo.word;
          a.href = '/?' + new URLSearchParams({ q: fo.word, lang: lang.value });
          if (fo.word === e.word) a.style.fontWeight = '700';
          fam.appendChild(a);
          if (fo.form) fam.appendChild(document.createTextNode(' (' + fo.form + ')'));
        });
        li.appendChild(fam);
      })
      .catch(() => {});
    results.appendChild(li);
  }
}

q.addEventListener('input', () => {
  clearBtn.style.display = q.value ? 'block' : 'none';
  clearTimeout(timer);
  timer = setTimeout(search, 300);
});
lang.addEventListener('change', () => { search(); loadDiscover(); });

async function loadTop() {
  const box = document.getElementById('top');
  const rows = await fetch('/suchen/top?limit=8').then(r => r.json());
  if (!rows.length) return;
  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = 'Meistgesucht:';
  box.appendChild(lbl);
  for (const r of rows) {
    const b = document.createElement('button');
    b.textContent = r.term;
    b.addEventListener('click', () => {
      q.value = r.term;
      if (r.language && [...lang.options].some(o => o.value === r.language)) lang.value = r.language;
      search();
    });
    box.appendChild(b);
  }
}

loadMeta().then(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('lang') && [...lang.options].some(o => o.value === p.get('lang'))) lang.value = p.get('lang');
  if (p.get('q')) q.value = p.get('q');
  search();
  loadDiscover();
});
loadTop();
</script>
</body>
</html>
