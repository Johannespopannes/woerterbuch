<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stichwortverzeichnis · Wörterbuch</title>
<link rel="stylesheet" href="/basis.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    padding: 6vh 1rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 1.5rem; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: normal; margin: 0 0 .3rem; }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--muted); font-style: italic; font-size: .95rem; }
  .langs {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: .4rem; margin-bottom: 1.4rem;
  }
  .langs button {
    font: inherit; font-size: .95rem;
    padding: .35rem .9rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  .langs button:hover { border-color: var(--accent); color: var(--accent); }
  .langs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .langs button small { opacity: .75; font-size: .8em; margin-left: .25rem; }
  .letters {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: .35rem; margin-bottom: 2rem; max-width: 700px;
  }
  .letters button {
    font: inherit; font-size: 1.05rem;
    width: 2.2rem; height: 2.2rem;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--card); color: var(--ink);
    cursor: pointer; text-transform: uppercase;
  }
  .letters button:hover { border-color: var(--accent); color: var(--accent); }
  .letters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #count { color: var(--muted); font-size: .9rem; margin-bottom: 1rem; min-height: 1.2em; }
  #words {
    width: min(900px, 100%);
    columns: 4 200px;
    column-gap: 2rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.5rem 2rem;
  }
  #words > a { display: block; break-inside: avoid; padding: .1rem 0;
               font-size: 1.05rem; color: inherit; text-decoration: none; }
  /* gepunktete Unterstreichung = klickbar, konsistent mit Def-Verweisen */
  #words > a > .w { border-bottom: 1px dotted var(--accent); }
  #words > a:hover > .w { color: var(--accent); border-bottom-style: solid; }
  #words small.def { display: block; color: var(--muted); font-size: .8rem; margin: 0 0 .35rem; }
  .wref { cursor: pointer; border-bottom: 1px dotted var(--accent); }
  .wref:hover { color: var(--accent); }
  #tip {
    display: none; position: absolute; z-index: 10; max-width: 320px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: .5rem .7rem;
    font-size: .85rem; color: var(--ink);
  }
  footer { margin-top: auto; padding-top: 2.5rem; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1><a href="/">Wörterbuch</a></h1>
  <div class="sub">Stichwortverzeichnis</div>
</header>

<nav class="langs" id="langs"></nav>
<nav class="letters" id="letters"></nav>
<div id="count">Sprache wählen …</div>
<div id="words"></div>

<footer>
  <a href="/">Zur Suche</a> · <a href="/verzeichnis">Stichwortverzeichnis</a> · <a href="/bewerten">Bilder bewerten</a> · <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a>
</footer>

<script>
const LANG_NAMES = { de: 'Deutsch', en: 'Englisch', fr: 'Französisch', es: 'Spanisch', it: 'Italienisch', ar: 'Arabisch', tn: 'Tunesisch' };
const LOCALES = { de: 'de-DE', en: 'en-GB', fr: 'fr-FR', es: 'es-ES', it: 'it-IT', ar: 'ar', tn: 'ar-TN' };

// Akzente, die auf den Basisbuchstaben gefaltet werden (API-Prefix ist
// Unicode-genau, darum werden die Varianten einzeln abgefragt und gemischt).
const FOLDED = {
  fr: { a: 'àâä', c: 'ç', e: 'éèêë', i: 'îï', o: 'ôö', u: 'ùûü', y: 'ÿ' },
  es: { a: 'á', e: 'é', i: 'í', o: 'ó', u: 'úü' },
  it: { a: 'à', e: 'èé', i: 'ìí', o: 'òó', u: 'ù' },
  ar: { 'ا': 'أإآٱ' },
  tn: { 'ا': 'أإآٱ' },
};
// Eigene Buchstaben (Reihenfolge im Alphabet): de hat ä ö ü ß, es hat ñ nach n.
const OWN_LETTERS = { de: ['ä', 'ö', 'ü', 'ß'], es: ['ñ'] };
// Arabisches Alphabet (28 Buchstaben) für ar/tn — statt a–z.
const AR_LETTERS = [..."ابتثجحخدذرزسشصضطظعغفقكلمنهوي"];

function letterGroups(lang) {
  if (lang === 'ar' || lang === 'tn') {
    // Hamza-Varianten werden unter ا gefaltet (FOLDED oben)
    return AR_LETTERS.map(l => [l, [l, ...((FOLDED[lang] || {})[l] || '')]]);
  }
  const base = [..."abcdefghijklmnopqrstuvwxyz"];
  const fold = FOLDED[lang] || {};
  const groups = base.map(l => [l, [l, ...(fold[l] || '')]]);
  if (lang === 'es') groups.splice(base.indexOf('n') + 1, 0, ['ñ', ['ñ']]);
  if (lang === 'de') for (const l of OWN_LETTERS.de) groups.push([l, [l]]);
  return groups;
}

const langsNav = document.getElementById('langs');
const lettersNav = document.getElementById('letters');
const wordsBox = document.getElementById('words');
const countBox = document.getElementById('count');
let lang = 'de';

// --- Querverweise: Wörter in Definitionen werden hover- & klickbar ---
const STOPWORDS = Object.fromEntries(Object.entries({
  de: 'der die das den dem des ein eine einer einem einen eines und oder aber mit für von zu in im am an auf aus bei nach über unter vor zwischen durch um als auch nicht nur sehr mehr wenig ist sind war waren wird werden hat haben hatte ich du er sie es wir ihr man sich so wie wenn dann denn noch schon zum zur vom beim ins ans',
  en: 'the a an and or but with for from to in on at of by as is are was were be been has have had not no so if then than this that these those it its he she they we you i his her their our your my',
  fr: 'le la les un une des de du au aux et ou mais avec pour dans sur par est sont était être a ont ce cette ces il elle ils elles on ne pas plus très son sa ses mon ma mes ton ta tes',
  es: 'el la los las un una unos unas de del al y o pero con para por en es son era ser ha han este esta estos estas su sus mi mis tu tus no más muy se lo le les',
  it: 'il lo la i gli le un una uno dei delle di del della al alla e o ma con per in su è sono era essere ha hanno questo questa questi queste suo sua suoi non più molto si ne ci',
}).map(([k, v]) => [k, new Set(v.split(' '))]));
const xrefCache = new Map();
const tip = document.createElement('div');
tip.id = 'tip';
document.body.appendChild(tip);
let tipTimer = null;

function xrefCandidates(tok) {
  const t = tok.replace(/^['’\-]+|['’\-]+$/g, '');
  const low = t.toLowerCase();
  const cap = low.charAt(0).toUpperCase() + low.slice(1);
  return [...new Set([t, low, cap])];
}

async function xrefLookup(word, langCode) {
  for (const cand of xrefCandidates(word)) {
    const key = langCode + '|' + cand.toLowerCase();
    if (!xrefCache.has(key)) {
      try {
        const r = await fetch('/lookup?' + new URLSearchParams({ word: cand, language: langCode }));
        xrefCache.set(key, r.ok ? await r.json() : null);
      } catch { xrefCache.set(key, null); }
    }
    const hit = xrefCache.get(key);
    if (hit) return hit;
  }
  return null;
}

function showTip(anchor, entry) {
  tip.innerHTML = '';
  const w = document.createElement('b');
  w.textContent = entry.word;
  tip.appendChild(w);
  tip.appendChild(document.createTextNode(' — ' + (entry.definition || '')));
  tip.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const maxX = window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8;
  tip.style.left = Math.max(8, Math.min(r.left + window.scrollX, maxX)) + 'px';
  tip.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function linkify(defEl, text, langCode) {
  const stops = STOPWORDS[langCode] || new Set();
  const re = /\p{L}[\p{L}\-'’]*/gu;
  let last = 0;
  for (const m of text.matchAll(re)) {
    defEl.appendChild(document.createTextNode(text.slice(last, m.index)));
    last = m.index + m[0].length;
    const raw = m[0];
    if (raw.length < 3 || stops.has(raw.toLowerCase())) {
      defEl.appendChild(document.createTextNode(raw));
      continue;
    }
    const s = document.createElement('span');
    s.className = 'wref';
    s.textContent = raw;
    s.addEventListener('mouseenter', () => {
      tipTimer = setTimeout(async () => {
        const hit = await xrefLookup(raw, langCode);
        if (!hit) { s.classList.remove('wref'); return; }
        showTip(s, hit);
      }, 200);
    });
    s.addEventListener('mouseleave', () => { clearTimeout(tipTimer); tip.style.display = 'none'; });
    s.addEventListener('click', (ev) => {
      ev.preventDefault();   // sonst gewinnt die umgebende Wort-Verlinkung
      ev.stopPropagation();
      location.href = '/?' + new URLSearchParams({ q: raw, lang: langCode });
    });
    defEl.appendChild(s);
  }
  defEl.appendChild(document.createTextNode(text.slice(last)));
}

async function fetchPrefix(prefix) {
  const all = [];
  let offset = 0;
  while (true) {
    const params = new URLSearchParams({ language: lang, prefix, limit: 1000, offset });
    const page = await fetch('/entries?' + params).then(r => r.json());
    all.push(...page);
    if (page.length < 1000) break;
    offset += page.length;
  }
  return all;
}

async function loadWords(display, prefixes, btn) {
  document.querySelectorAll('.letters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  wordsBox.innerHTML = '';
  countBox.textContent = 'lade …';
  const seen = new Set();
  const all = [];
  for (const p of prefixes) {
    for (const e of await fetchPrefix(p)) {
      if (!seen.has(e.id)) { seen.add(e.id); all.push(e); }
    }
  }
  const coll = new Intl.Collator(LOCALES[lang] || 'de-DE', { sensitivity: 'base' });
  all.sort((a, b) => coll.compare(a.word, b.word));
  countBox.textContent = all.length.toLocaleString('de-DE') +
    (all.length === 1 ? ' Wort' : ' Wörter') + ' unter „' + display.toUpperCase() + '“';
  for (const e of all) {
    const s = document.createElement('a');
    s.href = '/worteintrag?' + new URLSearchParams({ word: e.word, lang });
    const w = document.createElement('span');
    w.className = 'w';
    w.textContent = e.word;
    s.appendChild(w);
    if (e.definition) {
      const d = document.createElement('small');
      d.className = 'def';
      linkify(d, e.definition, lang);
      s.appendChild(d);
    }
    wordsBox.appendChild(s);
  }
}

function buildLetters(prefer) {
  lettersNav.innerHTML = '';
  for (const [display, prefixes] of letterGroups(lang)) {
    const b = document.createElement('button');
    b.textContent = display;
    b.addEventListener('click', () => loadWords(display, prefixes, b));
    lettersNav.appendChild(b);
  }
  const btn = [...lettersNav.children].find(b => b.textContent === prefer) || lettersNav.children[0];
  if (btn) btn.click();
}

async function init() {
  const langs = await fetch('/languages').then(r => r.json());
  for (const l of langs) {
    const b = document.createElement('button');
    b.innerHTML = '';
    b.textContent = LANG_NAMES[l.language] || l.language.toUpperCase();
    const small = document.createElement('small');
    small.textContent = l.count.toLocaleString('de-DE');
    b.appendChild(small);
    b.addEventListener('click', () => {
      lang = l.language;
      document.querySelectorAll('.langs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      buildLetters();
    });
    langsNav.appendChild(b);
  }
  if (langs.length) {
    const de = langs.find(l => l.language === 'de');
    lang = de ? 'de' : langs[0].language;
    const idx = langs.findIndex(l => l.language === lang);
    langsNav.children[idx].classList.add('active');
  }
  buildLetters(location.hash.slice(1).toLowerCase());
}

init();
</script>
</body>
</html>
